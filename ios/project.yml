name: Transi
options:
  bundleIdPrefix: com.transi
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  Transi:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../macos/Recordatorios.swift
    postBuildScripts:
      - name: Copy web app into bundle
        script: |
          set -euo pipefail
          destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/dist"
          mkdir -p "$destination"
          cp -R "${SRCROOT}/Resources/dist/." "$destination/"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transi.app
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: Transi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
