name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: transi
          POSTGRES_DB: transi
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        volumes:
          - ${{ github.workspace }}/backend/migrations:/docker-entrypoint-initdb.d:ro
        options: >-
          --health-cmd "pg_isready -U transi -d transi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://transi@localhost:5432/transi?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Formato (gofmt)
        run: test -z "$(gofmt -l .)"
        working-directory: backend

      - name: Análisis (go vet)
        run: go vet ./...
        working-directory: backend

      - name: Pruebas (go test)
        run: go test ./... -count=1
        working-directory: backend

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dependencias
        run: flutter pub get
        working-directory: app

      - name: Análisis (flutter analyze)
        run: flutter analyze
        working-directory: app

      - name: Pruebas (flutter test)
        run: flutter test
        working-directory: app
